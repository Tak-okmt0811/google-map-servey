name: Build Windows exe

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build exe with PyInstaller
        run: uv run pyinstaller viewer/build_exe.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitor-dashboard-windows
          # onefileの単一exeをそのままアップロードする（事前zip禁止）。
          # upload-artifactはダウンロード時に1回だけzip化するため、
          # 自前でzip化したファイルを渡すと「zipの中にzip」になってしまう。
          path: dist/competitor-dashboard.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Releaseの添付ファイルはzip化されず生ファイルのまま公開されるため、
          # クライアントはダウンロード後、解凍せずそのままexeを実行できる。
          files: dist/competitor-dashboard.exe
