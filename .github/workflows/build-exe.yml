name: Build Windows exe

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build exe with PyInstaller
        run: uv run pyinstaller viewer/build_exe.spec

      - name: Determine installer version
        id: version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v(\d.*)') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0-dev"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        # windows-latest ランナーのイメージ内容はバージョンにより変わるため
        # (Inno Setupがプリインストールされないことがある)、都度choco導入する。
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompetitorDashboardSetup
          # インストーラも単一exeなのでそのままアップロードする（事前zip禁止。理由は下記と同じ）。
          path: installer/output/CompetitorDashboardSetup.exe
          retention-days: 30

      - name: Upload raw exe artifact (advanced/debug use)
        uses: actions/upload-artifact@v4
        with:
          name: competitor-dashboard-windows
          # onefileの単一exeをそのままアップロードする（事前zip禁止）。
          # upload-artifactはダウンロード時に1回だけzip化するため、
          # 自前でzip化したファイルを渡すと「zipの中にzip」になってしまう。
          path: dist/competitor-dashboard.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Releaseの添付ファイルはzip化されず生ファイルのまま公開されるため、
          # クライアントはダウンロード後、解凍せずそのままインストーラを実行できる。
          # インストーラ(推奨)と、上級者向けに生exeの両方を添付する。
          files: |
            installer/output/CompetitorDashboardSetup.exe
            dist/competitor-dashboard.exe
